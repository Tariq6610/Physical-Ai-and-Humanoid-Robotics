<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot head -->
  <rect x="70" y="50" width="60" height="60" rx="10" fill="#445D48" stroke="#2C3E50" stroke-width="2"/>

  <!-- Robot eyes -->
  <circle cx="90" cy="70" r="5" fill="#E74C3C"/>
  <circle cx="110" cy="70" r="5" fill="#E74C3C"/>

  <!-- Robot mouth -->
  <rect x="95" y="85" width="10" height="3" rx="1" fill="#ECF0F1"/>

  <!-- Robot body -->
  <rect x="80" y="110" width="40" height="50" rx="5" fill="#34495E" stroke="#2C3E50" stroke-width="2"/>

  <!-- Robot arms -->
  <rect x="55" y="120" width="25" height="8" rx="4" fill="#34495E" stroke="#2C3E50" stroke-width="1"/>
  <rect x="120" y="120" width="25" height="8" rx="4" fill="#34495E" stroke="#2C3E50" stroke-width="1"/>

  <!-- Robot legs -->
  <rect x="85" y="160" width="10" height="25" rx="2" fill="#2C3E50"/>
  <rect x="105" y="160" width="10" height="25" rx="2" fill="#2C3E50"/>

  <!-- AI/Brain symbol -->
  <circle cx="100" cy="35" r="12" fill="none" stroke="#3498DB" stroke-width="2"/>
  <path d="M92 35 Q100 25 108 35 Q100 45 92 35" fill="#3498DB" opacity="0.7"/>

  <!-- Circuit pattern -->
  <path d="M75 130 Q80 125 85 130" stroke="#3498DB" stroke-width="1" fill="none"/>
  <path d="M115 130 Q120 125 125 130" stroke="#3498DB" stroke-width="1" fill="none"/>
</svg>
